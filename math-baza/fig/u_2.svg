<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 412" width="480" height="412" role="img" aria-label="Сокращение крест-накрест при умножении дробей"><title>Сокращение крест-накрест при умножении дробей</title><style>
.bg{fill:#FAF5EC;stroke:#D8C9B0;stroke-width:2}
.t{fill:#1E2F35}.tm{fill:#4E4638}.tb{fill:#1B5E74}.tr{fill:#A63F18}.tg{fill:#3F6A22}.td{fill:#7A4F06}.to{fill:#F7F0E4}
