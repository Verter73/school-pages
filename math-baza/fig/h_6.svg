<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380" role="img" aria-label="Схема комнаты: вид сверху 5 на 4 метра и вид на стену с дверью и окном"><title>Схема комнаты: вид сверху 5 на 4 метра и вид на стену с дверью и окном</title><style>
