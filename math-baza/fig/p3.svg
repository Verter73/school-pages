<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-label="Разобранный пример"><title>Разобранный пример</title><style>
.bg{fill:#FAF5EC;stroke:#D8C9B0;stroke-width:2}
.t{fill:#1E2F35}.tm{fill:#4E4638}.tb{fill:#1B5E74}.tr{fill:#A63F18}.tg{fill:#3F6A22}.td{fill:#7A4F06}.to{fill:#F7F0E4}
.fb{fill:#DDE4DE}.fr{fill:#F2DDCF}.fg{fill:#E2E6CE}.fd{fill:#F6E3B6}.fp{fill:#FAF5EC}
.fbs{fill:#1B5E74}.frs{fill:#A63F18}.fgs{fill:#3F6A22}.fds{fill:#7A4F06}.fi{fill:#1E2F35}
.sb{stroke:#1B5E74}.sr{stroke:#A63F18}.sg{stroke:#3F6A22}.sd{stroke:#7A4F06}.si{stroke:#1E2F35}.sl{stroke:#D8C9B0}
@media (prefers-color-scheme: dark){
.bg{fill:#243034;stroke:#3E4E53}
.t{fill:#F8F0E3}.tm{fill:#D2C6B0}.tb{fill:#8ECBDD}.tr{fill:#F09866}.tg{fill:#B3D67F}.td{fill:#EDC274}.to{fill:#1C2528}
.fb{fill:#22373D}.fr{fill:#3F2B23}.fg{fill:#2C3725}.fd{fill:#3A3020}.fp{fill:#243034}
.fbs{fill:#8ECBDD}.frs{fill:#F09866}.fgs{fill:#B3D67F}.fds{fill:#EDC274}.fi{fill:#F8F0E3}
.sb{stroke:#8ECBDD}.sr{stroke:#F09866}.sg{stroke:#B3D67F}.sd{stroke:#EDC274}.si{stroke:#F8F0E3}.sl{stroke:#3E4E53}
}
text{font-family:Jost,"Segoe UI",Arial,sans-serif;font-weight:600}
.mono{font-family:"JetBrains Mono",Consolas,"Courier New",monospace}
path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}
</style><rect class="bg" x="1" y="1" width="478" height="298" rx="14"/><text x="50" y="112" class="t" font-size="34" text-anchor="middle">18</text><text x="114" y="112" class="td" font-size="34" text-anchor="middle">−</text><text x="178" y="112" class="t" font-size="34" text-anchor="middle">2</text><text x="242" y="112" class="tb" font-size="34" text-anchor="middle">·</text><text x="306" y="112" class="t" font-size="34" text-anchor="middle">5</text><text x="370" y="112" class="tg" font-size="34" text-anchor="middle">+</text><text x="434" y="112" class="t" font-size="34" text-anchor="middle">3</text><circle cx="242" cy="62" r="17" class="fbs"/><text x="242" y="70" class="to" font-size="22" text-anchor="middle">1</text><circle cx="114" cy="62" r="17" class="fds"/><text x="114" y="70" class="to" font-size="22" text-anchor="middle">2</text><circle cx="370" cy="62" r="17" class="fgs"/><text x="370" y="70" class="to" font-size="22" text-anchor="middle">3</text><circle cx="34" cy="173" r="17" class="fbs"/><text x="34" y="181" class="to" font-size="22" text-anchor="middle">1</text><text x="64" y="180" class="tb" font-size="26" text-anchor="start">2 · 5 = 10  →  18 − 10 + 3</text><circle cx="34" cy="221" r="17" class="fds"/><text x="34" y="229" class="to" font-size="22" text-anchor="middle">2</text><text x="64" y="228" class="td" font-size="26" text-anchor="start">18 − 10 = 8  →  8 + 3</text><circle cx="34" cy="269" r="17" class="fgs"/><text x="34" y="277" class="to" font-size="22" text-anchor="middle">3</text><text x="64" y="276" class="tg" font-size="30" text-anchor="start">8 + 3 = 11</text></svg>
