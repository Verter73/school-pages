<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 290" width="480" height="290" role="img" aria-label="Рецепт: две чашки весов с мукой и яйцами и равенство отношений"><title>Рецепт: две чашки весов с мукой и яйцами и равенство отношений</title><style>
