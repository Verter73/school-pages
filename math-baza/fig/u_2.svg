</style><rect class="bg" x="1" y="1" width="478" height="410" rx="14"/><text x="240" y="34" class="t" font-size="24" text-anchor="middle">Сокращаем крест-накрест</text><text x="140" y="186" class="tb" font-size="44" text-anchor="middle">4</text><line x1="115.8" y1="196" x2="164.2" y2="196" class="si" stroke-width="4"/><text x="140" y="236" class="tr" font-size="44" text-anchor="middle">9</text><text x="340" y="186" class="tr" font-size="44" text-anchor="middle">3</text><line x1="315.8" y1="196" x2="364.2" y2="196" class="si" stroke-width="4"/><text x="340" y="236" class="tb" font-size="44" text-anchor="middle">8</text><text x="240" y="206" class="t" font-size="34" text-anchor="middle">·</text><line x1="126" y1="188" x2="154" y2="152" class="sb" stroke-width="4"/><line x1="326" y1="238" x2="354" y2="202" class="sb" stroke-width="4"/><line x1="126" y1="238" x2="154" y2="202" class="sr" stroke-width="4"/><line x1="326" y1="188" x2="354" y2="152" class="sr" stroke-width="4"/><text x="140" y="138" class="tb" font-size="28" text-anchor="middle">1</text><text x="340" y="138" class="tr" font-size="28" text-anchor="middle">1</text><text x="140" y="282" class="tr" font-size="28" text-anchor="middle">3</text><text x="340" y="282" class="tb" font-size="28" text-anchor="middle">2</text><text x="240" y="322" class="tb" font-size="22" text-anchor="middle">4 и 8: делим на 4 — получили 1 и 2</text><text x="240" y="352" class="tr" font-size="22" text-anchor="middle">3 и 9: делим на 3 — получили 1 и 3</text><text x="240" y="390" class="tg" font-size="28" text-anchor="middle">(1 · 1)/(3 · 2) = 1/6</text></svg>
