<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-label="Булки и хлеб"><title>Булки и хлеб</title><style>
.bg{fill:#FAF5EC;stroke:#D8C9B0;stroke-width:2}
.t{fill:#1E2F35}.tm{fill:#4E4638}.tb{fill:#1B5E74}.tr{fill:#A63F18}.tg{fill:#3F6A22}.td{fill:#7A4F06}.to{fill:#F7F0E4}
.fb{fill:#DDE4DE}.fr{fill:#F2DDCF}.fg{fill:#E2E6CE}.fd{fill:#F6E3B6}.fp{fill:#FAF5EC}
.fbs{fill:#1B5E74}.frs{fill:#A63F18}.fgs{fill:#3F6A22}.fds{fill:#7A4F06}.fi{fill:#1E2F35}
.sb{stroke:#1B5E74}.sr{stroke:#A63F18}.sg{stroke:#3F6A22}.sd{stroke:#7A4F06}.si{stroke:#1E2F35}.sl{stroke:#D8C9B0}
@media (prefers-color-scheme: dark){
.bg{fill:#243034;stroke:#3E4E53}
.t{fill:#F8F0E3}.tm{fill:#D2C6B0}.tb{fill:#8ECBDD}.tr{fill:#F09866}.tg{fill:#B3D67F}.td{fill:#EDC274}.to{fill:#1C2528}
.fb{fill:#22373D}.fr{fill:#3F2B23}.fg{fill:#2C3725}.fd{fill:#3A3020}.fp{fill:#243034}
.fbs{fill:#8ECBDD}.frs{fill:#F09866}.fgs{fill:#B3D67F}.fds{fill:#EDC274}.fi{fill:#F8F0E3}
.sb{stroke:#8ECBDD}.sr{stroke:#F09866}.sg{stroke:#B3D67F}.sd{stroke:#EDC274}.si{stroke:#F8F0E3}.sl{stroke:#3E4E53}
}
text{font-family:Jost,"Segoe UI",Arial,sans-serif;font-weight:600}
.mono{font-family:"JetBrains Mono",Consolas,"Courier New",monospace}
path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}
</style><rect class="bg" x="1" y="1" width="478" height="328" rx="14"/><text x="240" y="34" class="t" font-size="22" text-anchor="middle">2 булки по 30 ₽ и хлеб за 40 ₽</text><rect x="20" y="56" width="250" height="100" rx="10" class="fd sd" stroke-width="2" stroke-dasharray="8 6"/><rect x="34" y="84" width="96" height="56" rx="12" class="fp sd" stroke-width="2"/><text x="82" y="120" class="td" font-size="26" text-anchor="middle">30 ₽</text><rect x="146" y="84" width="96" height="56" rx="12" class="fp sd" stroke-width="2"/><text x="194" y="120" class="td" font-size="26" text-anchor="middle">30 ₽</text><circle cx="262" cy="56" r="22" class="fds"/><text x="262" y="64" class="to" font-size="22" text-anchor="middle">× 2</text><text x="288" y="120" class="t" font-size="34" text-anchor="middle">+</text><rect x="306" y="84" width="100" height="56" rx="12" class="fg sg" stroke-width="2"/><text x="356" y="120" class="tg" font-size="26" text-anchor="middle">40 ₽</text><text x="240" y="206" class="tg" font-size="32" text-anchor="middle">2 · 30 + 40 = 100</text><rect x="40" y="232" width="400" height="80" rx="10" class="fr sr" stroke-width="2" stroke-dasharray="8 6"/><text x="240" y="270" class="tr" font-size="26" text-anchor="middle">2 · (30 + 40) = 140</text><line x1="70" y1="276" x2="410" y2="254" class="sr" stroke-width="4" opacity="0.7"/><text x="240" y="302" class="tr" font-size="22" text-anchor="middle">хлеб не умножают</text></svg>
