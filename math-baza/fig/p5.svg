<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="Ловушка со скобками"><title>Ловушка со скобками</title><style>
.bg{fill:#FAF5EC;stroke:#D8C9B0;stroke-width:2}
.t{fill:#1E2F35}.tm{fill:#4E4638}.tb{fill:#1B5E74}.tr{fill:#A63F18}.tg{fill:#3F6A22}.td{fill:#7A4F06}.to{fill:#F7F0E4}
.fb{fill:#DDE4DE}.fr{fill:#F2DDCF}.fg{fill:#E2E6CE}.fd{fill:#F6E3B6}.fp{fill:#FAF5EC}
.fbs{fill:#1B5E74}.frs{fill:#A63F18}.fgs{fill:#3F6A22}.fds{fill:#7A4F06}.fi{fill:#1E2F35}
.sb{stroke:#1B5E74}.sr{stroke:#A63F18}.sg{stroke:#3F6A22}.sd{stroke:#7A4F06}.si{stroke:#1E2F35}.sl{stroke:#D8C9B0}
@media (prefers-color-scheme: dark){
.bg{fill:#243034;stroke:#3E4E53}
.t{fill:#F8F0E3}.tm{fill:#D2C6B0}.tb{fill:#8ECBDD}.tr{fill:#F09866}.tg{fill:#B3D67F}.td{fill:#EDC274}.to{fill:#1C2528}
.fb{fill:#22373D}.fr{fill:#3F2B23}.fg{fill:#2C3725}.fd{fill:#3A3020}.fp{fill:#243034}
.fbs{fill:#8ECBDD}.frs{fill:#F09866}.fgs{fill:#B3D67F}.fds{fill:#EDC274}.fi{fill:#F8F0E3}
.sb{stroke:#8ECBDD}.sr{stroke:#F09866}.sg{stroke:#B3D67F}.sd{stroke:#EDC274}.si{stroke:#F8F0E3}.sl{stroke:#3E4E53}
}
text{font-family:Jost,"Segoe UI",Arial,sans-serif;font-weight:600}
.mono{font-family:"JetBrains Mono",Consolas,"Courier New",monospace}
path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}
</style><rect class="bg" x="1" y="1" width="478" height="358" rx="14"/><rect x="10" y="10" width="460" height="170" rx="14" class="fg sg" stroke-width="2"/><text x="30" y="44" class="tg" font-size="24" text-anchor="start">Верно: слева направо</text><text x="30" y="86" class="t" font-size="26" text-anchor="start">36 : 6 = 6</text><text x="30" y="126" class="t" font-size="26" text-anchor="start">6 · 2 = 12</text><text x="30" y="166" class="tg" font-size="28" text-anchor="start">100 − 12 = 88</text><rect x="10" y="196" width="460" height="154" rx="14" class="fr sr" stroke-width="2" stroke-dasharray="8 6"/><text x="30" y="230" class="tr" font-size="24" text-anchor="start">Неверно: сами придумали скобки</text><text x="30" y="272" class="tr" font-size="26" text-anchor="start">36 : (6 · 2) = 36 : 12 = 3</text><text x="30" y="316" class="tr" font-size="26" text-anchor="start">100 − 3 = 97</text><line x1="30" y1="338" x2="450" y2="212" class="sr" stroke-width="4" opacity="0.55"/></svg>
