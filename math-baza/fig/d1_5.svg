</style><rect class="bg" x="1" y="1" width="478" height="278" rx="14"/><text x="240" y="44" class="tb" font-size="30" text-anchor="middle">3 7/9 = (3 · 9 + 7)/9</text><circle cx="34" cy="112" r="17" class="fbs"/><text x="34" y="120" class="to" font-size="22" text-anchor="middle">1</text><text x="64" y="120" class="tb" font-size="28" text-anchor="start">3 · 9 = 27</text><text x="240" y="120" class="tm" font-size="22" text-anchor="start">девятых в 3 целых</text><circle cx="34" cy="176" r="17" class="fds"/><text x="34" y="184" class="to" font-size="22" text-anchor="middle">2</text><text x="64" y="184" class="td" font-size="28" text-anchor="start">27 + 7 = ?</text><text x="240" y="184" class="tm" font-size="22" text-anchor="start">ещё 7 девятых</text><circle cx="34" cy="240" r="17" class="fgs"/><text x="34" y="248" class="to" font-size="22" text-anchor="middle">3</text><text x="64" y="248" class="tg" font-size="26" text-anchor="start">знаменатель остаётся 9</text></svg>
