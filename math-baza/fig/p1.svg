<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 372" width="480" height="372" role="img" aria-label="Лестница приоритетов"><title>Лестница приоритетов</title><style>
.bg{fill:#FAF5EC;stroke:#D8C9B0;stroke-width:2}
