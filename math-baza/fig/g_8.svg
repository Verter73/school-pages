</style><rect class="bg" x="1" y="1" width="478" height="288" rx="14"/><text x="240" y="34" class="tm" font-size="22" text-anchor="middle">Рецепт: мука и яйца растут одинаково</text><rect x="20" y="120" width="200" height="76" rx="10" class="fb sb" stroke-width="3"/><text x="120" y="152" class="tb" font-size="22" text-anchor="middle">2 стакана муки</text><text x="120" y="182" class="tb" font-size="22" text-anchor="middle">3 яйца</text><rect x="260" y="120" width="200" height="76" rx="10" class="fr sr" stroke-width="3"/><text x="360" y="152" class="tr" font-size="22" text-anchor="middle">6 стаканов муки</text><text x="360" y="182" class="tr" font-size="22" text-anchor="middle">x яиц</text><line x1="40" y1="100" x2="440" y2="100" class="si" stroke-width="4"/><line x1="120" y1="100" x2="120" y2="120" class="si" stroke-width="3"/><line x1="360" y1="100" x2="360" y2="120" class="si" stroke-width="3"/><line x1="240" y1="100" x2="240" y2="226" class="si" stroke-width="4"/><line x1="190" y1="226" x2="290" y2="226" class="si" stroke-width="4"/><text x="240" y="264" class="tg" font-size="32" text-anchor="middle">2/3 = 6/x</text></svg>
