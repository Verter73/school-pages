<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 430" width="480" height="430" role="img" aria-label="Одинаковые и разные знаки"><title>Одинаковые и разные знаки</title><style>
.bg{fill:#FAF5EC;stroke:#D8C9B0;stroke-width:2}
.t{fill:#1E2F35}.tm{fill:#4E4638}.tb{fill:#1B5E74}.tr{fill:#A63F18}.tg{fill:#3F6A22}.td{fill:#7A4F06}.to{fill:#F7F0E4}
.fb{fill:#DDE4DE}.fr{fill:#F2DDCF}.fg{fill:#E2E6CE}.fd{fill:#F6E3B6}.fp{fill:#FAF5EC}
.fbs{fill:#1B5E74}.frs{fill:#A63F18}.fgs{fill:#3F6A22}.fds{fill:#7A4F06}.fi{fill:#1E2F35}
.sb{stroke:#1B5E74}.sr{stroke:#A63F18}.sg{stroke:#3F6A22}.sd{stroke:#7A4F06}.si{stroke:#1E2F35}.sl{stroke:#D8C9B0}
@media (prefers-color-scheme: dark){
.bg{fill:#243034;stroke:#3E4E53}
.t{fill:#F8F0E3}.tm{fill:#D2C6B0}.tb{fill:#8ECBDD}.tr{fill:#F09866}.tg{fill:#B3D67F}.td{fill:#EDC274}.to{fill:#1C2528}
.fb{fill:#22373D}.fr{fill:#3F2B23}.fg{fill:#2C3725}.fd{fill:#3A3020}.fp{fill:#243034}
.fbs{fill:#8ECBDD}.frs{fill:#F09866}.fgs{fill:#B3D67F}.fds{fill:#EDC274}.fi{fill:#F8F0E3}
.sb{stroke:#8ECBDD}.sr{stroke:#F09866}.sg{stroke:#B3D67F}.sd{stroke:#EDC274}.si{stroke:#F8F0E3}.sl{stroke:#3E4E53}
}
text{font-family:Jost,"Segoe UI",Arial,sans-serif;font-weight:600}
.mono{font-family:"JetBrains Mono",Consolas,"Courier New",monospace}
path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}
</style><rect class="bg" x="1" y="1" width="478" height="428" rx="14"/><rect x="10" y="10" width="460" height="190" rx="14" class="fp sl" stroke-width="2"/><text x="24" y="44" class="tb" font-size="22" text-anchor="start">Одинаковые знаки: складываем модули</text><line x1="40" y1="100" x2="130" y2="100" class="sb" stroke-width="5"/><polygon points="130.0,100.0 116.0,108.0 116.0,92.0" class="fbs"/><line x1="130" y1="100" x2="280" y2="100" class="sg" stroke-width="5"/><polygon points="280.0,100.0 266.0,108.0 266.0,92.0" class="fgs"/><text x="85" y="86" class="tb" font-size="24" text-anchor="middle">3</text><text x="205" y="86" class="tg" font-size="24" text-anchor="middle">5</text><path d="M 40 120 V 130 H 280 V 120" class="si" fill="none" stroke-width="3"/><text x="160" y="166" class="tg" font-size="28" text-anchor="middle">3 + 5 = 8</text><text x="300" y="100" class="tm" font-size="22" text-anchor="start">знак тот же</text><rect x="10" y="214" width="460" height="206" rx="14" class="fp sl" stroke-width="2"/><text x="24" y="248" class="td" font-size="22" text-anchor="start">Разные знаки: вычитаем модули</text><line x1="240" y1="262" x2="240" y2="350" class="sl" stroke-width="2" stroke-dasharray="6 5"/><text x="240" y="372" class="tm" font-size="22" text-anchor="middle">0</text><line x1="240" y1="290" x2="336" y2="290" class="sg" stroke-width="5"/><polygon points="336.0,290.0 322.0,298.0 322.0,282.0" class="fgs"/><text x="288" y="278" class="tg" font-size="24" text-anchor="middle">4</text><line x1="336" y1="330" x2="120" y2="330" class="sr" stroke-width="5"/><polygon points="120.0,330.0 134.0,322.0 134.0,338.0" class="frs"/><text x="228" y="318" class="tr" font-size="24" text-anchor="middle">9</text><circle cx="120" cy="330" r="9" class="frs"/><text x="330" y="366" class="tm" font-size="22" text-anchor="start">9 − 4 = 5</text><text x="240" y="404" class="tr" font-size="28" text-anchor="middle">4 − 9 = −5</text></svg>
