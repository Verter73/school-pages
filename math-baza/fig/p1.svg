.fb{fill:#22373D}.fr{fill:#3F2B23}.fg{fill:#2C3725}.fd{fill:#3A3020}.fp{fill:#243034}
.fbs{fill:#8ECBDD}.frs{fill:#F09866}.fgs{fill:#B3D67F}.fds{fill:#EDC274}.fi{fill:#F8F0E3}
.sb{stroke:#8ECBDD}.sr{stroke:#F09866}.sg{stroke:#B3D67F}.sd{stroke:#EDC274}.si{stroke:#F8F0E3}.sl{stroke:#3E4E53}
}
text{font-family:Jost,"Segoe UI",Arial,sans-serif;font-weight:600}
.mono{font-family:"JetBrains Mono",Consolas,"Courier New",monospace}
path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}
</style><rect class="bg" x="1" y="1" width="478" height="370" rx="14"/><rect x="10" y="10" width="420" height="100" rx="14" class="fb sb" stroke-width="2"/><circle cx="46" cy="60" r="24" class="fbs"/><text x="46" y="70" class="to" font-size="28" text-anchor="middle">1</text><text x="84" y="46" class="tb" font-size="26" text-anchor="start">Скобки</text><text x="84" y="74" class="t" font-size="22" text-anchor="start">сначала всё внутри</text><text x="84" y="102" class="t mono" font-size="22" text-anchor="start">(3 + 4) · 2 = 7 · 2</text><rect x="30" y="136" width="420" height="100" rx="14" class="fd sd" stroke-width="2"/><circle cx="66" cy="186" r="24" class="fds"/><text x="66" y="196" class="to" font-size="28" text-anchor="middle">2</text><text x="104" y="172" class="td" font-size="26" text-anchor="start">Умножение и деление</text><text x="104" y="200" class="t" font-size="22" text-anchor="start">слева направо</text><text x="104" y="228" class="t mono" font-size="22" text-anchor="start">3 + 4 · 2 = 3 + 8</text><rect x="50" y="262" width="420" height="100" rx="14" class="fg sg" stroke-width="2"/><circle cx="86" cy="312" r="24" class="fgs"/><text x="86" y="322" class="to" font-size="28" text-anchor="middle">3</text><text x="124" y="298" class="tg" font-size="26" text-anchor="start">Сложение и вычитание</text><text x="124" y="326" class="t" font-size="22" text-anchor="start">слева направо</text><text x="124" y="354" class="t mono" font-size="22" text-anchor="start">18 − 10 + 3 = 8 + 3</text><line x1="240" y1="110" x2="240" y2="136" class="si" stroke-width="3"/><polygon points="240.0,136.0 232.0,122.0 248.0,122.0" class="fi"/><text x="252" y="128" class="tm" font-size="22" text-anchor="start">потом</text><line x1="240" y1="236" x2="240" y2="262" class="si" stroke-width="3"/><polygon points="240.0,262.0 232.0,248.0 248.0,248.0" class="fi"/><text x="252" y="254" class="tm" font-size="22" text-anchor="start">потом</text></svg>
